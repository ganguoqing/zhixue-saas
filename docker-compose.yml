services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: zhixue_bootstrap
      POSTGRES_PASSWORD: zhixue_bootstrap_dev_only
      POSTGRES_DB: zhixue_m0_g1compose
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixue_bootstrap -d zhixue_m0_g1compose"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4.2
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
