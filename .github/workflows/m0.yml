name: m0
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "docker-compose.yml"
      - ".github/workflows/m0.yml"
      - "package.json"
      - "package-lock.json"
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r apps/worker/requirements.txt
      - run: npm ci
      - run: ZHIXUE_PROFILE=compose node scripts/run-isolated.mjs
      - name: Preserve M0 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-g1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/runs/**/*.json
            var/runs/**/*.txt
            var/runs/**/*.log
            var/runs/**/*.err
            var/runs/**/*.sha256
            !var/runs/**/objects/**
            !var/runs/**/restore-objects/**
          if-no-files-found: warn
