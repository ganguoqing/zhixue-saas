name: m0
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "db/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r apps/worker/requirements.txt
      - run: npm install
      - run: node scripts/run-m0.mjs
